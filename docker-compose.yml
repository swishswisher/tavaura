services:
  db:
    image: postgres:16.14-bookworm
    container_name: tavaura-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: tavaura_dev
      POSTGRES_USER: tavaura
      POSTGRES_PASSWORD: tavaura_password
    volumes:
      - tavaura_db_data:/var/lib/postgresql/data

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: tavaura-storage
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: tavaura
      MINIO_ROOT_PASSWORD: tavaura_storage_secret
    volumes:
      - tavaura_storage_data:/data

volumes:
  tavaura_db_data:
  tavaura_storage_data:
