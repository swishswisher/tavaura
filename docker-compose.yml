version: '3.9'

services:
  db:
    image: postgres:16
    container_name: tavaura-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: tavaura_dev
      POSTGRES_USER: tavaura
      POSTGRES_PASSWORD: tavaura_password
    volumes:
      - tavaura_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tavaura-redis
    ports:
      - '6379:6379'
    volumes:
      - tavaura_redis_data:/data

  storage:
    image: minio/minio:latest
    container_name: tavaura-storage
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: tavaura
      MINIO_ROOT_PASSWORD: tavaura_storage_secret
    volumes:
      - tavaura_storage_data:/data

volumes:
  tavaura_db_data:
  tavaura_redis_data:
  tavaura_storage_data:

