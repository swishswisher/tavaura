version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /backend/Tavaura.Api
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /backend/Tavaura.Api.Tests
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
